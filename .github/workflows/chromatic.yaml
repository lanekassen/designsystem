name: Chromatic

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  chromatic:
    name: "Publish to Chromatic"
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks
    if: >-
      github.repository == 'lanekassen/designsystem' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions: {}
    # CHROMATIC_PROJECT_TOKEN is stored as a secret in this environment
    environment: chromatic
    concurrency:
      group: chromatic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history is required by TurboSnap
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR branch instead of the merge commit. Chromatic resolves the commit from
          # the local branch named by GITHUB_HEAD_REF, and falls back to the merge commit without it
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # 6.0.8
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm --filter './packages/*' build

      # --stats-json writes preview-stats.json, which Chromatic needs for TurboSnap
      - name: Build Storybook
        run: pnpm --filter @apps/storybook build:chromatic

      - name: Publish to Chromatic
        run: pnpm --filter @apps/storybook chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
