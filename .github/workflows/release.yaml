name: Publish Package

on:
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    name: "Publish to npmjs.com"
    runs-on: ubuntu-latest
    if: github.repository == 'lanekassen/designsystem' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write # Required for OIDC
    concurrency:
      group: release-npm-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # 6.0.8
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          # never use caching in release builds
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build
        run: pnpm build
        shell: bash

      - name: Publish
        run: pnpm changeset publish
        shell: bash
        env:
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
